<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Infographic và Video</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
    }
    .infographic {
      max-width: 80%;
      height: auto;
      margin-bottom: 30px;
    }
    .video {
      width: 80%;
      height: 450px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>Infographic và Video YouTube</h1>

  <!-- Hiển thị infographic -->
  <img src="Lab05_Ex2.1.png.png" alt="Infographic minh họa" class="infographic">

  <!-- Nhúng video YouTube -->
  <iframe class="video"
          src="https://www.youtube.com/embed/TNzAKSnuatw"
          title="YouTube video"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
  </iframe>

<h2>Ghi chú bản quyền</h2>

    <p>
        Infographic tạo bởi Canva AI, hình ảnh từ Unsplash
        (Unsplash license).
    </p>

    <p>
        Video tạo bởi CapCut, tài liệu từ Pexels/FreeSound (CC0).
    </p>
</body>
</html>
